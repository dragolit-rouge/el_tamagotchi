<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Tamagotchi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-yellow-50 to-amber-100 min-h-screen text-slate-700 p-4 flex items-center justify-center font-sans">
    
    <div class="relative mx-auto [image-rendering:pixelated] bg-[url('pixil-frame-0.png')] bg-contain bg-no-repeat bg-center shrink-0" style="width: 350px; height: 400px; min-width: 350px; min-height: 400px;">
    
        <!-- Внутреннее рабочее окно -->
        <div class="absolute flex flex-col items-center justify-between text-center overflow-y-auto p-2" style="top: 45px; left: 35px; width: 280px; height: 310px;">
            
            <!-- Верхняя часть: аватар, имя и статус -->
            <div class="w-full flex flex-col items-center">
                <!-- Аватарка -->
                <div class="w-14 h-14 mx-auto mb-2 rounded-2xl overflow-hidden shadow-sm border-2 border-purple-300 bg-pink-100 flex items-center justify-center relative shrink-0">
                    <img id="user-avatar" src="" alt="Аватар" class="w-full h-full object-cover hidden">
                    <span id="avatar-fallback" class="text-xl">🐱</span>
                </div>

                <!-- Тексты -->
                <h1 class="text-base font-black text-purple-600 tracking-wide mb-1">Привет, <span id="username">милашка</span>! ✨</h1>
                <p class="text-slate-400 text-[11px] font-medium">El Tamagochi Hub успешно загружен</p>
            </div>

            <div class="w-full flex flex-col gap-2 mt-2">
                <button id="action-btn" class="w-full bg-gradient-to-r from-purple-400 to-rose-400 hover:from-purple-500 hover:to-rose-500 text-white font-bold py-2.5 px-4 rounded-xl shadow-md shadow-purple-400/40 active:scale-95 transition-all duration-150 border-b-2 border-rose-500/60 active:border-b-0 active:translate-y-0.5 text-xs">
                    Нажми меня!
                </button>
                
                <!-- кнопка добавления бота -->
                <a href="https://t.me/antired_angry_bot?startgroup=true" target="_blank" 
                   class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-md shadow-amber-400/40 active:scale-95 transition-all duration-150 border-b-2 border-amber-600/60 active:border-b-0 active:translate-y-0.5 text-xs text-center block">
                    Добавить бота в группу
                </a>
            </div>

        </div>
    </div>
</body>
</html>
